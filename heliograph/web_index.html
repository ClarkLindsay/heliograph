<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heliograph</title>
<link rel="icon" href="/icons/heliograph">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Heliograph">
<meta name="theme-color" content="#0f4c5c">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#e1e1e6;--card:#f6f6f8;--acc:#2f6fed;--ok:#1f8a4c;--bad:#c62828;--warn:#b26a00;--grey:#7a7a80}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececef;--mut:#9a9aa2;--line:#2d2d31;--card:#202024;--acc:#6b9bff;--ok:#4cc27c;--bad:#ff7a70;--warn:#e0a040;--grey:#8a8a92}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0}nav button{background:none;border:0;color:var(--mut);font:inherit;padding:6px 10px;cursor:pointer;border-radius:6px}
nav button.on{color:var(--fg);background:var(--card)}main{max-width:1100px;margin:0 auto;padding:16px}
button,input,select{font:inherit}button.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button.btn:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.danger{color:var(--bad)}
input[type=text],input[type=password],input[type=number],select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.mut{color:var(--mut)}.small{font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.card h3{margin:0 0 4px;font-size:15px}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:12px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:13px}
tr.book{cursor:pointer}tr.book:hover{background:var(--card)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;margin:1px 3px 1px 0;border:1px solid var(--line);color:var(--grey)}
.chip.linked{color:var(--ok);border-color:var(--ok)}.flag{color:var(--bad)}.chip.nomatch,.chip.error{color:var(--bad);border-color:var(--bad)}.chip.skip{text-decoration:line-through}.chip.recorded{color:var(--acc);border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--acc)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;padding:16px}
.svc{border-top:1px solid var(--line);padding:12px 0}.cand{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.field{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:8px;align-items:center;margin:7px 0}
.msg{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--card)}.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
a{color:var(--acc)}.ico{border-radius:6px;vertical-align:middle;margin-right:6px}.thumb{width:48px;height:72px;object-fit:cover;border-radius:4px;background:var(--card);flex:none}.cover{width:64px;height:96px;object-fit:cover;border-radius:5px;background:var(--card);margin-right:12px;flex:none}.msg.warn{color:var(--warn)}.prog{margin:8px 0}@media(max-width:600px){.field{grid-template-columns:1fr}}
</style></head><body>
<header><img src="/icons/heliograph" width="26" height="26" alt="" style="border-radius:6px"><h1>Heliograph</h1><nav id="nav"></nav><span class="grow"></span><span id="top" class="mut small"></span><span id="who" class="row small"></span></header>
<main id="main"></main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
 for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e}
const pct=x=>Math.round((x||0)*100)+'%';
const hm=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`};
function fill(el,...c){el.replaceChildren(...c.flat().filter(x=>x!=null&&x!==false))}
function put(el,...c){c.flat().filter(x=>x!=null&&x!==false).forEach(x=>el.append(x))}
async function api(path,body){const o=body===undefined?{}:{method:'POST',headers:{'X-Requested-With':'heliograph-ui','Content-Type':'application/json'},body:JSON.stringify(body)};
 const r=await fetch(path,o);if(r.status===401&&path.startsWith('/api/')){location.reload();throw new Error('Signed out')}
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
let me={user:'',admin:false};
const ago=t=>{if(!t)return'never';const s=Math.max(0,Date.now()/1000-t);return s<90?Math.round(s)+'s ago':s<5400?Math.round(s/60)+'m ago':s<172800?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const LAB={linked:'linked',nomatch:'no match',error:'error',skip:'skipped',recorded:'recorded',pending:'pending'};
let tab='dash',timer=null,tabToken=0,onClose=null,svcLabels={},svcHome={},savedMsg=null;
let imp={services:null,statuses:new Set(['reading','read','want']),dry:true,skip:true};
const BRAND={hardcover:['#2b2d42','H'],goodreads:['#5b4636','g'],storygraph:['#1a9aa3','S'],fable:['#7b4fd6','F'],pagebound:['#2f6fed','P'],librarything:['#3b6ea5','L']};
function mono(key){const b=BRAND[key]||['#666',(key||'?')[0].toUpperCase()];const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' rx='14' fill='${b[0]}'/><text x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='#fff'>${b[1]}</text></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(svg)}
const safeUrl=u=>/^https?:\/\/\S+$/.test(u||'');
function homeIcon(x,px){const i=icon(x.key,px||22);return safeUrl(x.home)?h('a',{href:x.home,target:'_blank',rel:'noopener noreferrer',title:'Open '+x.label},i):i}
function icon(key,px){const i=h('img',{src:'/icons/'+key,width:px,height:px,alt:'',class:'ico'});let done=false;i.addEventListener('error',()=>{if(!done){done=true;i.setAttribute('src',mono(key))}});return i}
function setTab(t){tab=t;tabToken++;clearTimeout(timer);timer=null;onClose=null;$('#nav').replaceChildren(...[['dash','Dashboard'],['books','Books'],['import','Import'],['hardcover','Hardcover'],['bookorbit','BookOrbit'],['settings','Settings'],['account',me.admin?'Users':'Account']].map(([k,l])=>h('button',{class:tab===k?'on':'',onclick:()=>setTab(k)},l)));
 ({dash:dash,books:books,import:importTab,hardcover:hardcoverTab,bookorbit:bookorbitTab,settings:settings,account:account})[t]()}

/* Account: your password; the admin also manages users and invite codes. */
function account(){const m=$('#main'),tok=tabToken;
 const cur=h('input',{type:'password',id:'pw-current',autocomplete:'current-password'}),nw=h('input',{type:'password',id:'pw-new',autocomplete:'new-password'}),pwOut=h('div');
 const pwCard=h('div',{class:'card'},h('h3',{},'Your password'),h('p',{class:'small mut'},`Signed in as ${me.user}${me.admin?' (admin)':''}. Changing your password signs out your other devices.`),
  h('div',{class:'field'},h('label',{for:'pw-current'},'Current password'),cur),h('div',{class:'field'},h('label',{for:'pw-new'},'New password (8+ characters)'),nw),
  h('div',{class:'row'},h('span',{class:'grow'}),h('button',{class:'btn pri',onclick:async()=>{try{await api('/api/account/password',{current:cur.value,new:nw.value});cur.value=nw.value='';note(pwOut,'Password changed.','good')}catch(e){note(pwOut,e.message,'bad')}}},'Change password')),pwOut);
 if(!me.admin){fill(m,pwCard);return}
 const users=h('div'),invs=h('div'),out=h('div'),code=h('div');
 const render=r=>{if(tok!==tabToken)return;
  const rf=r.refresher||{};
  const refCell=u=>{if(!rf.set)return h('td',{class:'small mut'},'—');if(u.admin)return h('td',{class:'small mut'},`${rf.admin_account} (yours)`);
   const i=h('input',{type:'text',id:'ref-'+u.name,value:u.refresher_account||'',placeholder:'none',style:'width:9em',autocapitalize:'none',spellcheck:'false'});
   return h('td',{},h('div',{class:'row'},i,h('button',{class:'btn small',onclick:async()=>{try{await api('/api/admin/user/refresher',{name:u.name,account:i.value.trim()});
    note(out,i.value.trim()?`${u.name} now uses refresher account '${i.value.trim().toLowerCase()}'. They log in to Goodreads in its noVNC window titled [ShelfSync: ${i.value.trim().toLowerCase()}].`:`${u.name} no longer uses your refresher.`,'good')}catch(e){note(out,e.message,'bad')}}},'Save')))};
  fill(users,h('table',{},h('tr',{},h('th',{},'User'),h('th',{},'Role'),h('th',{},'Since'),h('th',{title:'Which account on your Goodreads cookie refresher this user gets'},'Refresher account'),h('th',{})),
   r.users.map(u=>h('tr',{},h('td',{},u.name),h('td',{},u.admin?'admin':'user'),h('td',{class:'small mut'},new Date(u.created*1000).toLocaleDateString()),refCell(u),
    h('td',{style:'text-align:right'},u.name===r.me?null:delBtn(u.name))))),
   rf.set?h('p',{class:'small mut'},'Refresher account: a name from your cookie refresher’s ACCOUNTS list. Users without their own refresher get Goodreads cookies from yours, for that account only. Each user needs a different one, never yours.'):
   h('p',{class:'small mut'},'Set up a Goodreads cookie refresher in Settings → Goodreads to share it with other users.'));
  fill(invs,r.invites.length?r.invites.map(i=>h('div',{class:'cand'},h('div',{class:'grow small'},`Invite …${i.id.slice(0,6)} by ${i.by} · expires ${new Date(i.expires*1000).toLocaleDateString()}`),
   h('button',{class:'btn small',onclick:async()=>{try{render(Object.assign(await api('/api/admin/users'),await api('/api/admin/invite/delete',{id:i.id})))}catch(e){note(out,e.message,'bad')}}},'Revoke'))):h('p',{class:'small mut'},'No unused invite codes.'))};
 const delBtn=name=>{const b=h('button',{class:'btn small danger',onclick:async()=>{
   if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=`Delete ${name}? Click again`;setTimeout(()=>{b.dataset.armed='';b.textContent='Delete'},4000);return}
   try{render(Object.assign(await api('/api/admin/users'),await api('/api/admin/user/delete',{name})));note(out,`Deleted ${name}. Their data folder was kept aside on the server.`,'good')}catch(e){note(out,e.message,'bad')}}},'Delete');return b};
 const mk=h('button',{class:'btn pri',onclick:async()=>{try{const r=await api('/api/admin/invite',{});render(Object.assign(await api('/api/admin/users'),r));
   const c=h('code',{style:'font-size:17px;user-select:all'},r.code);
   fill(code,h('div',{class:'msg good'},h('div',{},'New invite code (shown once; works once; expires in 7 days):'),h('div',{class:'row',style:'margin-top:6px'},c,
    h('button',{class:'btn small',onclick:async()=>{try{await navigator.clipboard.writeText(r.code);note(out,'Copied.','good')}catch(e){getSelection().selectAllChildren(c)}}},'Copy'))))}
  catch(e){note(out,e.message,'bad')}}},'Create invite code');
 fill(m,pwCard,h('div',{class:'card',style:'margin-top:12px'},h('h3',{},'Users'),h('p',{class:'small mut'},'Each user has their own Hardcover token, services, library and settings. New people sign up on the sign-in page with an invite code.'),users,out),
  h('div',{class:'card',style:'margin-top:12px'},h('h3',{},'Invite codes'),h('div',{class:'row'},h('span',{class:'grow small mut'},'Give a code to someone you want to let in.'),mk),code,invs));
 api('/api/admin/users').then(render).catch(e=>note(out,e.message,'bad'))}
function note(el,text,cls){el.replaceChildren(h('div',{class:'msg '+(cls||'')},text))}

/* Pages are built once and then updated in place (text, bars, lists whose content changed), so periodic refreshes
   never rebuild the DOM: no flicker, scroll positions and typed input survive. tabToken drops answers that arrive after a tab switch. */
function loop(fn,tok){async function tick(){if(tok!==tabToken)return;let d=8000;try{d=(await fn())||8000}catch(e){}if(tok===tabToken)timer=setTimeout(tick,d)}tick()}
function setText(el,t){t=String(t==null?'':t);if(el.textContent!==t)el.textContent=t}
function sigOf(x){return JSON.stringify(x)}
function closeModal(){$('#modal').replaceChildren();if(onClose)onClose()}

function dash(){const m=$('#main'),tok=tabToken;let ui=null;fill(m,h('p',{class:'mut'},'Loading…'));
 function build(){
  const u={res:h('div'),sum:h('span'),nxt:h('span',{class:'mut small'}),sec:h('div',{class:'msg warn small',style:'display:none'}),cnt:h('p',{class:'mut small'}),
   imp:h('div',{class:'msg small',style:'display:none'}),cards:h('div',{class:'cards'}),pre:h('pre',{},'…'),refs:{},keys:'',logTxt:null};
  u.impText=h('span');u.imp.append(u.impText,' ',h('a',{href:'#',onclick:e=>{e.preventDefault();setTab('import')}},'Open the Import tab'));
  fill(m,h('div',{class:'row'},h('b',{},'Last cycle: '),u.sum,h('span',{class:'grow'}),u.nxt,
     h('button',{class:'btn pri',onclick:async()=>{try{await api('/api/sync',{});note(u.res,'Sync requested.','good');setTimeout(()=>tok===tabToken&&refresh(),3000)}catch(e){note(u.res,e.message,'bad')}}},'Sync now'),
     h('button',{class:'btn',onclick:async e=>{e.target.disabled=true;try{const r=await api('/api/refresh-library',{});note(u.res,`Library refreshed: ${r.books} books.`,'good')}catch(x){note(u.res,x.message,'bad')}e.target.disabled=false}},'Refresh library')),
   u.sec,u.imp,u.res,u.cnt,u.cards,h('h3',{},'Recent log'),u.pre);return u}
 function cards(s){const list=[{key:'hardcover',label:'Hardcover (source)',enabled:true,counts:null,home:s.hardcover_home},...s.services];
  const keys=list.map(x=>x.key+'|'+x.home).join();
  if(keys!==ui.keys){ui.keys=keys;ui.refs={};fill(ui.cards,list.map(x=>{const r={state:h('div',{class:'small'}),counts:h('div',{class:'small mut'})};ui.refs[x.key]=r;const out=h('div',{class:'small mut'});
    return h('div',{class:'card'},h('h3',{},homeIcon(x,22),x.label),r.state,r.counts,h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn small',onclick:async e=>{e.target.disabled=true;out.textContent='Testing…';
      try{const t=await api('/api/test/'+x.key,{});out.textContent=(t.ok?'✓ ':'✗ ')+t.message}catch(err){out.textContent='✗ '+err.message}e.target.disabled=false}},'Test login')),out)}))}
  list.forEach(x=>{const r=ui.refs[x.key];setText(r.state,x.enabled?'enabled':'disabled');r.state.className='small '+(x.enabled?'':'mut');
   setText(r.counts,x.counts?`${x.counts.linked} linked · ${x.counts.nomatch} no match · ${x.counts.error} errors`+(x.counts.skip?` · ${x.counts.skip} skipped`:''):'')})}
 async function refresh(){const s=await api('/api/status');if(tok!==tabToken)return 8000;if(!ui)ui=build();
  s.services.forEach(x=>{svcLabels[x.key]=x.label;svcHome[x.key]=x.home});svcHome.hardcover=s.hardcover_home;
  const next=s.next_run?Math.round(s.next_run-s.now):0;
  setText($('#top'),s.running?'syncing…':'last cycle '+ago(s.last_end));
  setText(ui.sum,s.last_end?`${s.examined} book(s) examined, ${s.pushed} update(s) pushed — ${s.result}`:s.result);
  setText(ui.nxt,next>0?`next in ~${Math.ceil(next/60)} min (every ${s.poll_minutes} min)`:'');
  const pl=s.secrets&&s.secrets.plaintext;ui.sec.style.display=pl?'':'none';setText(ui.sec,pl?`${pl} secret(s) are stored unencrypted in config.json. See README → Protecting secrets.`:'');
  const j=s.job||{};ui.imp.style.display=j.running?'':'none';if(j.running)setText(ui.impText,`${j.dry?'Preview':'Import'} running: ${j.done}/${j.total} books — ${j.message||''}.`);
  setText(ui.cnt,`${s.books} books known from Hardcover.`);cards(s);
  const l=await api('/api/log?n=150');if(tok!==tabToken)return 8000;const txt=l.lines.join('\n');
  if(txt!==ui.logTxt){const atEnd=ui.logTxt===null||ui.pre.scrollTop+ui.pre.clientHeight>=ui.pre.scrollHeight-24;ui.logTxt=txt;ui.pre.textContent=txt;if(atEnd)ui.pre.scrollTop=ui.pre.scrollHeight}
  return j.running?3000:8000}
 dash.refresh=refresh;
 loop(async()=>{try{return await refresh()}catch(e){if(!ui)fill(m,h('div',{class:'msg bad'},e.message));else note(ui.res,e.message,'bad');return 8000}},tok)}

/* Hardcover: data corrections. The only place Heliograph writes to Hardcover, and only when you press Apply. */
function hardcoverTab(){const m=$('#main'),tok=tabToken,u={};
  u.hcOut=h('div');u.hcList=h('div');
  const hcRow=b=>{const res=h('div',{class:'small'});
    const opt=c=>h('option',{value:c.id,selected:c.id===b.suggested},[c.format,c.edition_format,c.pages?c.pages+' p':'',c.users?c.users+' readers':'',c.isbn?'ISBN '+c.isbn:'',c.title].filter(Boolean).join(' · '));
    const sel=b.candidates.length?h('select',{style:'max-width:100%'},...b.candidates.map(opt)):null;
    const go=h('button',{class:'btn small pri',onclick:async()=>{
      if(!confirm(`Change “${b.title}” in your Hardcover library to the selected edition? (Its ${b.current.language} edition is replaced; your status, rating and dates stay.)`))return;
      go.disabled=true;try{await api('/api/hardcover/cleanup',{id:b.id,edition_id:+sel.value});sel.disabled=true;go.remove();note(res,'✓ Changed in Hardcover','ok')}catch(e){go.disabled=false;note(res,e.message,'bad')}}},'Apply');
    return h('div',{class:'cand'},h('div',{class:'grow'},h('b',{},b.title),
      h('div',{class:'small mut'},`Now: ${b.current.language} · ${[b.current.format,b.current.edition_format].filter(Boolean).join(' · ')} · “${b.current.title||''}”`),
      sel||h('div',{class:'small'},`No ${u.hcLang} edition of this book on Hardcover: change it there by hand.`),res),sel?go:null)};
  u.hcFind=h('button',{class:'btn',onclick:async()=>{u.hcFind.disabled=true;note(u.hcOut,'Looking through your Hardcover library…');
    try{const r=await api('/api/hardcover/cleanup');u.hcLang=r.language;fill(u.hcOut,null);
      fill(u.hcList,r.books.length?h('div',{},h('p',{class:'small mut'},`${r.books.length} book(s) with a non-${r.language} edition. The suggested ${r.language} edition (same format, most used) is pre-selected.`),r.books.map(hcRow)):h('div',{class:'msg ok'},`Every book in your Hardcover library uses a ${r.language} edition (or doesn’t say).`))}
    catch(e){note(u.hcOut,e.message,'bad')}finally{u.hcFind.disabled=false}}},'Find non-English editions');
  const OPS={start:'Start date',dates:'Change dates',add:'Add a read'};
  const d={msg:h('div',{class:'small'}),list:h('div'),out:h('div'),sel:new Set(),seen:0,picked:0,sig:'',items:[]};
  const fmt=x=>x||'—',isDone=i=>/^✓/.test(i.result||'');
  const what=i=>i.op==='add'?`started ${fmt(i.started)}, finished ${fmt(i.finished)}`:
    i.op==='start'?`${fmt(i.was[0])} → ${i.started}`+(i.finished?` (finished ${i.finished})`:' (still reading)'):
    `${fmt(i.was[0])} – ${fmt(i.was[1])} → ${fmt(i.started)} – ${fmt(i.finished)}`;
  d.scan=h('button',{class:'btn',onclick:async()=>{try{await api('/api/hardcover/dates/scan',{});setTimeout(()=>tok===tabToken&&poll(),300)}catch(e){note(d.out,e.message,'bad')}}},'Scan Goodreads');
  d.apply=h('button',{class:'btn pri',style:'display:none',onclick:async()=>{
    const keys=d.items.filter(i=>d.sel.has(i.key)&&!isDone(i)).map(i=>i.key);
    if(!confirm(`Write ${keys.length} date change(s) to your Hardcover library?`))return;
    try{await api('/api/hardcover/dates/apply',{keys});setTimeout(()=>tok===tabToken&&poll(),300)}catch(e){note(d.out,e.message,'bad')}}},'Apply');
  const pick=f=>{d.sel.clear();d.items.forEach(i=>{if(!isDone(i)&&f(i))d.sel.add(i.key)});d.sig='';render()};
  const link=(t,f)=>h('a',{href:'#',onclick:e=>{e.preventDefault();pick(f)}},t);
  d.bulk=h('span',{class:'small',style:'display:none'},'Select ',link('all',()=>true),' · ',link('suggested',i=>i.pick),' · ',link('none',()=>false));
  function render(){const items=d.items,sg=sigOf([items.map(i=>[i.key,i.result]),[...d.sel],d.running]);
    const n=items.filter(i=>d.sel.has(i.key)&&!isDone(i)).length,show=items.length&&!d.running;
    d.apply.style.display=show?'':'none';d.apply.disabled=!n;setText(d.apply,`Apply ${n} change(s)`);
    d.bulk.style.display=show?'':'none';
    if(sg===d.sig)return;d.sig=sg;
